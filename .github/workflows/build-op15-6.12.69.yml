name: Build OP15 6.12.69 Android16 KMI6

on:
  workflow_dispatch:
    inputs:
      root_mode:
        description: 'Root features'
        type: choice
        options: [KSUN-SUSFS, KSUN, stock]
        default: KSUN-SUSFS

permissions:
  contents: read

concurrency:
  group: op15-6.12.69-${{ github.ref }}-${{ inputs.root_mode }}
  cancel-in-progress: false

env:
  ACK_COMMIT: 242e1a07f8782987c579929a20a74c0b26e88608
  MANIFEST_COMMIT: 76bdc0766742b0fd58b572bbbb5e204201362f1d
  KSUN_COMMIT: 763a08d21a4d938c1b22603529c404b269d01fba
  SUSFS_COMMIT: b213c54126fb243595ce7876e91d84d6e0861fec
  PATCHES_COMMIT: 6e7d8d8d064ce7e487a23daf7cde581d93ede999
  AK3_COMMIT: 0b46673ae91aee8d60bd6ee257b4d56d3f6a0114
  ROOT_MODE: ${{ inputs.root_mode }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout build configuration
        uses: actions/checkout@v6

      - name: Free runner disk space
        run: |
          set -euo pipefail
          # Run cleanup synchronously so it cannot race the dependency install.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h / "$GITHUB_WORKSPACE"

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo apt-get install -y --no-install-recommends \
            git curl ca-certificates build-essential flex bison libelf-dev \
            libssl-dev libncurses-dev zlib1g-dev bc python3 rsync unzip zip \
            file xz-utils lz4 dwarves libdw-dev elfutils
          curl -fLsS --retry 3 https://storage.googleapis.com/git-repo-downloads/repo -o /tmp/repo
          sudo install -m 0755 /tmp/repo /usr/local/bin/repo
          git config --global user.name github-actions
          git config --global user.email github-actions@github.com
          # ThinLTO can exceed the memory available on a hosted runner.
          sudo fallocate -l 16G /swapfile-op15
          sudo chmod 600 /swapfile-op15
          sudo mkswap /swapfile-op15
          sudo swapon /swapfile-op15

      - name: Sync the pinned r54 sources and toolchains
        run: |
          set -euo pipefail
          mkdir kernel artifacts
          cd kernel
          repo init -u https://android.googlesource.com/kernel/manifest \
            -b "$MANIFEST_COMMIT" --depth=1 --no-clone-bundle
          cp ../manifests/gki/op15-6.12.69.xml .repo/manifests/default.xml
          repo sync -c --no-tags --no-clone-bundle --fail-fast -j2
          test "$(git -C common rev-parse HEAD)" = "$ACK_COMMIT"
          python3 - <<'PY'
          import re
          from pathlib import Path
          makefile = Path('common/Makefile').read_text()
          version = '.'.join(re.search(rf'^{key}\s*=\s*(\d+)', makefile, re.M)[1]
                             for key in ('VERSION', 'PATCHLEVEL', 'SUBLEVEL'))
          constants = Path('common/build.config.constants').read_text()
          assert version == '6.12.69', version
          assert re.search(r'^KMI_GENERATION=6$', constants, re.M), constants
          assert re.search(r'^BRANCH=android16-6\.12$', constants, re.M), constants
          print('Verified source: Android16, 6.12.69, KMI generation 6')
          PY
          repo manifest -r -o ../artifacts/source-manifest.xml

      - name: Integrate pinned KernelSU-Next
        if: inputs.root_mode != 'stock'
        working-directory: kernel
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU-Next
          git -C KernelSU-Next checkout --detach "$KSUN_COMMIT"
          test "$(git -C KernelSU-Next rev-parse HEAD)" = "$KSUN_COMMIT"
          ln -s ../../KernelSU-Next/kernel common/drivers/kernelsu
          printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> common/drivers/Makefile
          printf '\nsource "drivers/kernelsu/Kconfig"\n' >> common/drivers/Kconfig
          printf '\nCONFIG_KSU=y\n' >> common/arch/arm64/configs/gki_defconfig

      - name: Integrate pinned SUSFS v2.3.0
        if: inputs.root_mode == 'KSUN-SUSFS'
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 --retry-all-errors \
            "https://gitlab.com/api/v4/projects/simonpunk%2Fsusfs4ksu/repository/archive.tar.gz?sha=$SUSFS_COMMIT" \
            -o /tmp/op15-susfs.tar.gz
          mkdir susfs4ksu
          tar -xzf /tmp/op15-susfs.tar.gz --strip-components=1 -C susfs4ksu
          git init kernel_patches
          git -C kernel_patches remote add origin https://github.com/FRTI64/kernel_patches.git
          git -C kernel_patches fetch --depth=1 origin "$PATCHES_COMMIT"
          git -C kernel_patches checkout --detach FETCH_HEAD
          test "$(git -C kernel_patches rev-parse HEAD)" = "$PATCHES_COMMIT"
          grep -q '^#define SUSFS_VERSION "v2.3.0"' susfs4ksu/kernel_patches/include/linux/susfs.h
          cd kernel/KernelSU-Next
          # The enable patch targets tiann's tree. Resolve its expected
          # rejects using the fixes pinned to the matching KSUN revision.
          if ! patch --batch -p1 --forward < ../../susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch; then
            test -n "$(find kernel -name '*.rej' -print -quit)"
          fi
          while IFS= read -r -d '' reject; do
            file="$(basename "$reject" .rej)"
            fix="../../kernel_patches/next/susfs_fix_patches/v2.3.0/fix_$file.patch"
            test -f "$fix"
            patch --batch -p1 --forward < "$fix"
            rm -- "$reject"
          done < <(find kernel -name '*.rej' -print0)
          patch --batch -p1 --forward < ../../kernel_patches/next/susfs_fix_patches/v2.3.0/susfs_extras.patch
          test -z "$(find kernel -name '*.rej' -print -quit)"
          grep -q '^config KSU_SUSFS$' kernel/Kconfig
          cd ../..
          cp susfs4ksu/kernel_patches/fs/* kernel/common/fs/
          cp susfs4ksu/kernel_patches/include/linux/* kernel/common/include/linux/
          python3 scripts/prepare-op15-susfs-patch.py \
            susfs4ksu/kernel_patches/50_add_susfs_in_gki-android16-6.12.patch \
            /tmp/op15-susfs-r54.patch
          patch --batch --dry-run -d kernel/common -p1 --forward < /tmp/op15-susfs-r54.patch
          patch --batch -d kernel/common -p1 --forward < /tmp/op15-susfs-r54.patch
          printf '\nCONFIG_KSU_SUSFS=y\n' >> kernel/common/arch/arm64/configs/gki_defconfig

      - name: Configure the custom kernel build
        if: inputs.root_mode != 'stock'
        run: |
          set -euo pipefail
          # Include the uapi headers in the integrated KSUN checkout.
          printf '\nccflags-y += -I$(srctree)/drivers/kernelsu/include/uapi\n' >> kernel/KernelSU-Next/kernel/Kbuild
          python3 - <<'PY'
          from pathlib import Path
          build = Path('kernel/common/BUILD.bazel')
          text = build.read_text()
          anchor = '    name = "kernel_aarch64",\n'
          assert text.count(anchor) == 1
          text = text.replace(anchor, anchor + '    check_defconfig = "disabled",\n', 1)
          build.write_text(text)
          PY

      - name: Build the 4KB GKI kernel with Kleaf
        working-directory: kernel
        run: |
          set -euo pipefail
          flags=(--config=local --lto=thin --jobs=2)
          if [ "$ROOT_MODE" != stock ]; then
            flags+=(--notrim)
          fi
          tools/bazel run "${flags[@]}" //common:kernel_aarch64_dist \
            -- --dist_dir="$GITHUB_WORKSPACE/artifacts" 2>&1 | tee ../artifacts/build.log

      - name: Verify and package the kernel
        run: |
          set -euo pipefail
          test -s artifacts/Image
          test -s artifacts/vmlinux
          test -s artifacts/Module.symvers
          python3 - <<'PY'
          import re, struct
          from pathlib import Path
          image = Path('artifacts/Image').read_bytes()
          assert image[56:60] == b'ARM\x64', 'Invalid ARM64 Image header'
          flags, = struct.unpack_from('<Q', image, 24)
          assert (flags >> 1) & 3 == 1, 'Expected 4KB page size'
          match = re.search(rb'Linux version 6\.12\.69-android16-6[^\x00\n]*',
                            Path('artifacts/vmlinux').read_bytes())
          assert match, 'Built kernel release does not match 6.12.69-android16-6'
          release = match[0].decode(errors='replace')
          Path('artifacts/kernel-version.txt').write_text(release + '\n')
          print(release)
          PY
          git init AnyKernel3
          git -C AnyKernel3 remote add origin https://github.com/WildKernels/AnyKernel3.git
          git -C AnyKernel3 fetch --depth=1 origin "$AK3_COMMIT"
          git -C AnyKernel3 checkout --detach FETCH_HEAD
          cp artifacts/Image AnyKernel3/Image
          zip_name="AK3_OP15_android16-6.12.69_KMI6_4k_${ROOT_MODE}.zip"
          (cd AnyKernel3 && zip -r9 "../artifacts/$zip_name" . -x '.git/*' '.github/*' '.gitignore' 'README.md')
          printf 'ACK=%s\nKSUN=%s\nSUSFS=%s\nPATCHES=%s\nAK3=%s\nROOT_MODE=%s\n' \
            "$ACK_COMMIT" "$KSUN_COMMIT" "$SUSFS_COMMIT" "$PATCHES_COMMIT" "$AK3_COMMIT" "$ROOT_MODE" \
            > artifacts/build-info.txt
          (cd artifacts && sha256sum Image "$zip_name" > SHA256SUMS)
          {
            echo '### OP15 Android16 6.12.69 (KMI 6, 4KB)'
            echo "Root features: $ROOT_MODE"
            cat artifacts/kernel-version.txt
            echo 'Source and patch checks passed. Device boot compatibility requires testing on the phone.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload kernel and diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: OP15-android16-6.12.69-KMI6-4k-${{ inputs.root_mode }}
          path: |
            artifacts/*.zip
            artifacts/Image
            artifacts/Module.symvers
            artifacts/SHA256SUMS
            artifacts/*.txt
            artifacts/*.xml
            artifacts/*.log
          if-no-files-found: warn
          retention-days: 7
