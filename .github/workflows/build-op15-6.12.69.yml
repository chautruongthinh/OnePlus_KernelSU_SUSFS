name: Build OP15 6.12.69 Android16 KMI6

on:
  workflow_dispatch:
    inputs:
      root_mode:
        description: 'Root features'
        type: choice
        options: [KSUN-SUSFS, KSUN, stock]
        default: KSUN-SUSFS
      wild_features:
        description: 'Add r54-compatible WildKernels features (BBG, NTSync, network and tuning)'
        type: boolean
        default: true
      droidspaces:
        description: 'Experimental Droidspaces namespaces; changes Rust CRCs and may require rebuilt Rust modules'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: op15-6.12.69-${{ github.ref }}-${{ inputs.root_mode }}-${{ inputs.wild_features }}-${{ inputs.droidspaces }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout build configuration
        uses: actions/checkout@v6
      - name: Build and verify OP15 r54
        uses: ./.github/actions/build-op15-gki
        with:
          root_mode: ${{ inputs.root_mode }}
          wild_features: ${{ inputs.wild_features }}
          droidspaces: ${{ inputs.droidspaces }}
