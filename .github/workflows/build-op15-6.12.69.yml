name: Build OP15 6.12.69 Android16 KMI6

on:
  workflow_dispatch:
    inputs:
      root_mode:
        description: 'Root features'
        type: choice
        options: [KSUN-SUSFS, KSUN, stock]
        default: KSUN-SUSFS
      wild_features:
        description: 'Add r54-compatible WildKernels features (BBG, NTSync, network and tuning)'
        type: boolean
        default: true
      droidspaces:
        description: 'Experimental Droidspaces namespaces; changes Rust CRCs and may require rebuilt Rust modules'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: op15-6.12.69-${{ github.ref }}-${{ inputs.root_mode }}-${{ inputs.wild_features }}-${{ inputs.droidspaces }}
  cancel-in-progress: false

env:
  ACK_COMMIT: 242e1a07f8782987c579929a20a74c0b26e88608
  MANIFEST_COMMIT: 76bdc0766742b0fd58b572bbbb5e204201362f1d
  KSUN_COMMIT: 763a08d21a4d938c1b22603529c404b269d01fba
  SUSFS_COMMIT: b213c54126fb243595ce7876e91d84d6e0861fec
  PATCHES_COMMIT: 6e7d8d8d064ce7e487a23daf7cde581d93ede999
  AK3_COMMIT: 0b46673ae91aee8d60bd6ee257b4d56d3f6a0114
  ROOT_MODE: ${{ inputs.root_mode }}
  WILD_FEATURES: ${{ inputs.wild_features && inputs.root_mode != 'stock' }}
  FEATURE_SUFFIX: ${{ inputs.wild_features && inputs.root_mode != 'stock' && '_Wild' || '' }}
  DROIDSPACES: ${{ inputs.wild_features && inputs.droidspaces && inputs.root_mode != 'stock' }}
  DROIDSPACES_SUFFIX: ${{ inputs.wild_features && inputs.droidspaces && inputs.root_mode != 'stock' && '_Droidspaces' || '' }}
  WILD_PATCHES_COMMIT: 44b23a7601b98a3c548e2584e9f294d7b8b2d19b
  BBG_COMMIT: a54e0dc6cf0aff4dd87fec49644a02d2eb612905

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout build configuration
        uses: actions/checkout@v6

      - name: Free runner disk space
        if: runner.environment == 'github-hosted'
        run: |
          set -euo pipefail
          mkdir -p artifacts
          bash scripts/op15-disk-space.sh report | tee artifacts/disk-space.log
          # Run cleanup synchronously so it cannot race the dependency install.
          # This job uses apt dependencies and AOSP prebuilts, not the hosted SDKs.
          sudo rm -rf /usr/share/dotnet /usr/share/swift /usr/local/lib/android \
            /usr/local/.ghcup /opt/ghc /opt/hostedtoolcache /opt/az /opt/google \
            /opt/microsoft /usr/local/share/powershell /usr/local/share/chromium \
            /usr/local/lib/node_modules /usr/lib/google-cloud-sdk
          if command -v docker >/dev/null 2>&1; then
            sudo docker image prune --all --force
            sudo docker builder prune --all --force
          fi
          sudo apt-get clean
          bash scripts/op15-disk-space.sh report | tee -a artifacts/disk-space.log

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo apt-get install -y --no-install-recommends \
            git curl ca-certificates build-essential flex bison libelf-dev \
            libssl-dev libncurses-dev zlib1g-dev bc python3 rsync unzip zip \
            file xz-utils lz4 dwarves libdw-dev elfutils
          curl -fLsS --retry 3 https://storage.googleapis.com/git-repo-downloads/repo -o /tmp/repo
          sudo install -m 0755 /tmp/repo /usr/local/bin/repo
          git config --global user.name github-actions
          git config --global user.email github-actions@github.com
          # No-LTO builds do not need the former 16GB swap allocation.
          sudo fallocate -l 4G /swapfile-op15
          sudo chmod 600 /swapfile-op15
          sudo mkswap /swapfile-op15
          sudo swapon /swapfile-op15

      - name: Sync the pinned r54 sources and toolchains
        run: |
          set -euo pipefail
          mkdir -p kernel artifacts
          bash scripts/op15-disk-space.sh check 45 'before source sync' | tee -a artifacts/disk-space.log
          cd kernel
          git config --global http.version HTTP/1.1
          git config --global http.lowSpeedLimit 1024
          git config --global http.lowSpeedTime 120
          repo init -u https://android.googlesource.com/kernel/manifest \
            -b "$MANIFEST_COMMIT" --depth=1 --no-clone-bundle
          cp ../manifests/gki/op15-6.12.69.xml .repo/manifests/default.xml
          # Large prebuilt fetches can be interrupted. Reuse the checkout on
          # retries and skip pinned projects whose objects are already present.
          sync_ok=0
          sync_log="$GITHUB_WORKSPACE/artifacts/source-sync.log"
          for attempt in 1 2 3; do
            bash "$GITHUB_WORKSPACE/scripts/op15-disk-space.sh" check 4 'before sync attempt' | tee -a "$GITHUB_WORKSPACE/artifacts/disk-space.log"
            sync_jobs=2
            if [ "$attempt" -gt 1 ]; then
              sync_jobs=1
            fi
            echo "Source sync attempt $attempt/3 (parallel downloads: $sync_jobs)" | tee -a "$sync_log"
            if timeout --kill-after=60s 30m repo sync -c --no-tags --no-clone-bundle \
                --no-manifest-update --optimized-fetch --retry-fetches=2 -j"$sync_jobs" \
                2>&1 | tee -a "$sync_log"; then
              sync_ok=1
              break
            else
              sync_status=${PIPESTATUS[0]}
            fi
            echo "::warning::Source sync attempt $attempt failed (exit $sync_status)." | tee -a "$sync_log"
            df -h . | tee -a "$sync_log"
            if [ "$attempt" -lt 3 ]; then
              sleep "$((attempt * 30))"
            fi
          done
          if [ "$sync_ok" -ne 1 ]; then
            echo "::error::Source sync failed after 3 attempts. See source-sync.log in the artifacts."
            exit 1
          fi
          test "$(git -C common rev-parse HEAD)" = "$ACK_COMMIT"
          python3 - <<'PY'
          import re
          from pathlib import Path
          makefile = Path('common/Makefile').read_text()
          version = '.'.join(re.search(rf'^{key}\s*=\s*(\d+)', makefile, re.M)[1]
                             for key in ('VERSION', 'PATCHLEVEL', 'SUBLEVEL'))
          constants = Path('common/build.config.constants').read_text()
          assert version == '6.12.69', version
          assert re.search(r'^KMI_GENERATION=6$', constants, re.M), constants
          assert re.search(r'^BRANCH=android16-6\.12$', constants, re.M), constants
          print('Verified source: Android16, 6.12.69, KMI generation 6')
          PY
          repo manifest -r -o ../artifacts/source-manifest.xml

      - name: Integrate pinned KernelSU-Next
        if: inputs.root_mode != 'stock'
        working-directory: kernel
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU-Next
          # The pinned revision may no longer be reachable from advertised
          # branches after an upstream rebase. Fetch it explicitly before checkout.
          git -C KernelSU-Next fetch --no-tags origin "$KSUN_COMMIT"
          git -C KernelSU-Next checkout --detach "$KSUN_COMMIT"
          test "$(git -C KernelSU-Next rev-parse HEAD)" = "$KSUN_COMMIT"
          ln -s ../../KernelSU-Next/kernel common/drivers/kernelsu
          printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> common/drivers/Makefile
          printf '\nsource "drivers/kernelsu/Kconfig"\n' >> common/drivers/Kconfig
          printf '\nCONFIG_KSU=y\n' >> common/arch/arm64/configs/gki_defconfig

      - name: Integrate pinned SUSFS v2.3.0
        if: inputs.root_mode == 'KSUN-SUSFS'
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 --retry-all-errors \
            "https://gitlab.com/api/v4/projects/simonpunk%2Fsusfs4ksu/repository/archive.tar.gz?sha=$SUSFS_COMMIT" \
            -o /tmp/op15-susfs.tar.gz
          mkdir susfs4ksu
          tar -xzf /tmp/op15-susfs.tar.gz --strip-components=1 -C susfs4ksu
          git init kernel_patches
          git -C kernel_patches remote add origin https://github.com/FRTI64/kernel_patches.git
          git -C kernel_patches fetch --depth=1 origin "$PATCHES_COMMIT"
          git -C kernel_patches checkout --detach FETCH_HEAD
          test "$(git -C kernel_patches rev-parse HEAD)" = "$PATCHES_COMMIT"
          grep -q '^#define SUSFS_VERSION "v2.3.0"' susfs4ksu/kernel_patches/include/linux/susfs.h
          cd kernel/KernelSU-Next
          # The enable patch targets tiann's tree. Resolve its expected
          # rejects using the fixes pinned to the matching KSUN revision.
          if ! patch --batch -p1 --forward < ../../susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch; then
            test -n "$(find kernel -name '*.rej' -print -quit)"
          fi
          while IFS= read -r -d '' reject; do
            file="$(basename "$reject" .rej)"
            fix="../../kernel_patches/next/susfs_fix_patches/v2.3.0/fix_$file.patch"
            test -f "$fix"
            patch --batch -p1 --forward < "$fix"
            rm -- "$reject"
          done < <(find kernel -name '*.rej' -print0)
          patch --batch -p1 --forward < ../../kernel_patches/next/susfs_fix_patches/v2.3.0/susfs_extras.patch
          test -z "$(find kernel -name '*.rej' -print -quit)"
          grep -q '^config KSU_SUSFS$' kernel/Kconfig
          cd ../..
          cp susfs4ksu/kernel_patches/fs/* kernel/common/fs/
          cp susfs4ksu/kernel_patches/include/linux/* kernel/common/include/linux/
          python3 scripts/prepare-op15-susfs-patch.py \
            susfs4ksu/kernel_patches/50_add_susfs_in_gki-android16-6.12.patch \
            /tmp/op15-susfs-r54.patch
          patch --batch --dry-run -d kernel/common -p1 --forward < /tmp/op15-susfs-r54.patch
          patch --batch -d kernel/common -p1 --forward < /tmp/op15-susfs-r54.patch
          printf '\nCONFIG_KSU_SUSFS=y\n' >> kernel/common/arch/arm64/configs/gki_defconfig

      - name: Integrate pinned WildKernels features
        if: inputs.wild_features && inputs.root_mode != 'stock'
        run: |
          set -euo pipefail
          git init wild-kernel-patches
          git -C wild-kernel-patches remote add origin https://github.com/WildKernels/kernel_patches.git
          git -C wild-kernel-patches fetch --depth=1 origin "$WILD_PATCHES_COMMIT"
          git -C wild-kernel-patches checkout --detach FETCH_HEAD
          git init baseband-guard
          git -C baseband-guard remote add origin https://github.com/vc-teahouse/Baseband-guard.git
          git -C baseband-guard fetch --depth=1 origin "$BBG_COMMIT"
          git -C baseband-guard checkout --detach FETCH_HEAD
          options=()
          if [ "$DROIDSPACES" = true ]; then
            options+=(--droidspaces)
          fi
          python3 scripts/apply-op15-wild-features.py kernel/common wild-kernel-patches \
            baseband-guard artifacts/wild-features.json "${options[@]}" 2>&1 | tee artifacts/wild-features.log

      - name: Configure the custom kernel build
        if: inputs.root_mode != 'stock'
        run: |
          set -euo pipefail
          # Include the uapi headers in the integrated KSUN checkout.
          printf '\nccflags-y += -I$(srctree)/drivers/kernelsu/include/uapi\n' >> kernel/KernelSU-Next/kernel/Kbuild
          python3 - <<'PY'
          from pathlib import Path
          build = Path('kernel/common/BUILD.bazel')
          text = build.read_text()
          anchor = '    name = "kernel_aarch64",\n'
          assert text.count(anchor) == 1
          text = text.replace(anchor, anchor + '    check_defconfig = "disabled",\n', 1)
          build.write_text(text)
          PY

      - name: Build the 4KB GKI kernel with Kleaf
        working-directory: kernel
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/scripts/op15-disk-space.sh" check 12 'before kernel build' | tee -a "$GITHUB_WORKSPACE/artifacts/disk-space.log"
          # r54's GENDWARFKSYMS requires ELF objects and depends on !LTO.
          # Preserve the Android16 symbol CRC generator used by stock modules.
          flags=(--config=local --lto=none --jobs=2)
          if [ "$ROOT_MODE" != stock ]; then
            flags+=(--notrim)
          fi
          tools/bazel run "${flags[@]}" //common:kernel_aarch64_dist \
            -- --destdir="$GITHUB_WORKSPACE/artifacts" 2>&1 | tee ../artifacts/build.log

      - name: Verify and package the kernel
        run: |
          set -euo pipefail
          test -s artifacts/Image
          test -s artifacts/vmlinux
          # Kleaf exports the complete symbol table with the target prefix.
          # Refresh the alias even when reusing a local artifacts directory.
          test -s artifacts/kernel_aarch64_Module.symvers
          cp artifacts/kernel_aarch64_Module.symvers artifacts/Module.symvers
          test -s artifacts/Module.symvers
          if [ "$WILD_FEATURES" = true ]; then
            python3 scripts/verify-op15-lsm.py artifacts/vmlinux | tee artifacts/lsm-verification.txt
          fi
          python3 - <<'PY'
          import os, re, struct
          from pathlib import Path
          image = Path('artifacts/Image').read_bytes()
          assert image[56:60] == b'ARM\x64', 'Invalid ARM64 Image header'
          flags, = struct.unpack_from('<Q', image, 24)
          assert (flags >> 1) & 3 == 1, 'Expected 4KB page size'
          match = re.search(rb'Linux version 6\.12\.69-android16-6[^\x00\n]*',
                            Path('artifacts/vmlinux').read_bytes())
          assert match, 'Built kernel release does not match 6.12.69-android16-6'
          config = Path('artifacts/kernel_aarch64_dot_config').read_text()
          for required in ('CONFIG_MODVERSIONS=y', 'CONFIG_GENDWARFKSYMS=y'):
              assert required in config.splitlines(), f'Missing {required}'
          if os.environ['ROOT_MODE'] != 'stock':
              assert 'CONFIG_KSU=y' in config.splitlines(), 'KernelSU is not enabled'
          if os.environ['ROOT_MODE'] == 'KSUN-SUSFS':
              assert 'CONFIG_KSU_SUSFS=y' in config.splitlines(), 'SUSFS is not enabled'
          if os.environ['WILD_FEATURES'] == 'true':
              import json
              features = json.loads(Path('artifacts/wild-features.json').read_text())
              for key, value in features['required_config'].items():
                  expected = f'CONFIG_{key}={value}'
                  if value == 'n':
                      expected = f'# CONFIG_{key} is not set'
                  assert expected in config.splitlines(), f'Missing WildKernels option: {expected}'
              symbols = Path('artifacts/System.map').read_text()
              required_symbols = ['bbg_init', 'ntsync_init']
              if os.environ['DROIDSPACES'] == 'true':
                  required_symbols.append('init_ghost_task')
                  print('::warning::Experimental Droidspaces changes Rust export CRCs; matching Rust modules may be required.')
              for symbol in required_symbols:
                  assert re.search(rf'^[0-9a-f]+ [tT] {symbol}$', symbols, re.M), f'Missing built feature: {symbol}'
              reference = json.loads(Path('configs/gki/op15-6.12.69-kmi6.json').read_text())
              versions = {fields[1]: fields[0] for line in Path('artifacts/Module.symvers').read_text().splitlines()
                          if len(fields := line.split()) >= 2}
              for symbol, crc in reference['symbols'].items():
                  assert versions.get(symbol) == crc, f'Baseline CRC changed: {symbol}: {versions.get(symbol)} != {crc}'
              if os.environ['DROIDSPACES'] != 'true':
                  for symbol, crc in reference['rust_symbols'].items():
                      assert versions.get(symbol) == crc, f'Baseline Rust CRC changed: {symbol}'
          release = match[0].decode(errors='replace')
          Path('artifacts/kernel-version.txt').write_text(release + '\n')
          print(release)
          PY
          git init AnyKernel3
          git -C AnyKernel3 remote add origin https://github.com/WildKernels/AnyKernel3.git
          git -C AnyKernel3 fetch --depth=1 origin "$AK3_COMMIT"
          git -C AnyKernel3 checkout --detach FETCH_HEAD
          cp artifacts/Image AnyKernel3/Image
          zip_name="AK3_OP15_android16-6.12.69_KMI6_4k_${ROOT_MODE}${FEATURE_SUFFIX}${DROIDSPACES_SUFFIX}.zip"
          (cd AnyKernel3 && zip -r9 "../artifacts/$zip_name" . -x '.git/*' '.github/*' '.gitignore' 'README.md')
          printf 'ACK=%s\nKSUN=%s\nSUSFS=%s\nPATCHES=%s\nAK3=%s\nROOT_MODE=%s\n' \
            "$ACK_COMMIT" "$KSUN_COMMIT" "$SUSFS_COMMIT" "$PATCHES_COMMIT" "$AK3_COMMIT" "$ROOT_MODE" \
            > artifacts/build-info.txt
          printf 'WILD_FEATURES=%s\nWILD_PATCHES=%s\nBBG=%s\n' \
            "$WILD_FEATURES" "$WILD_PATCHES_COMMIT" "$BBG_COMMIT" >> artifacts/build-info.txt
          printf 'DROIDSPACES=%s\n' "$DROIDSPACES" >> artifacts/build-info.txt
          (cd artifacts && sha256sum Image "$zip_name" > SHA256SUMS)
          {
            echo '### OP15 Android16 6.12.69 (KMI 6, 4KB)'
            echo "Root features: $ROOT_MODE"
            echo "WildKernels features enabled: $WILD_FEATURES"
            echo "Experimental Droidspaces enabled: $DROIDSPACES"
            cat artifacts/kernel-version.txt
            echo 'Source and patch checks passed. Device boot compatibility requires testing on the phone.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record runner disk usage
        if: always()
        run: |
          mkdir -p artifacts
          bash scripts/op15-disk-space.sh report | tee -a artifacts/disk-space.log

      - name: Upload AnyKernel3 ZIP
        uses: actions/upload-artifact@v7
        with:
          path: artifacts/AK3_OP15_android16-6.12.69_KMI6_4k_${{ inputs.root_mode }}${{ env.FEATURE_SUFFIX }}${{ env.DROIDSPACES_SUFFIX }}.zip
          archive: false
          if-no-files-found: error
          retention-days: 7

      - name: Upload kernel Image
        uses: actions/upload-artifact@v7
        with:
          path: artifacts/Image
          archive: false
          if-no-files-found: error
          retention-days: 7

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: OP15-build-failure-${{ inputs.root_mode }}
          path: |
            artifacts/kernel_aarch64_dot_config
            artifacts/*.txt
            artifacts/*.xml
            artifacts/*.json
            artifacts/*.log
          if-no-files-found: warn
          retention-days: 7
